name: Test and publish launcher
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify generated launcher sources
        run: |
          python3 scripts/build-launcher.py
          git diff --exit-code -- v2.sh
          test ! -e v1.sh
      - name: Test the code format
        run: node --test test/*.test.mjs
      - name: Test launcher with isolated fake installers
        run: |
          python3 -m pip install pytest 'ansible-core>=2.17,<2.18'
          python3 -m pytest test/ -q
      - name: Check shell syntax
        run: |
          sh -n v2.sh
          bash --posix -n v2.sh
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh -e SC1112 v2.sh lib/runtime.sh lib/callback.sh
      - name: Package public files only
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        run: |
          mkdir _site
          cp v2.sh index.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
