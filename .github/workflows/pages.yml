name: Test and publish launcher
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test the code format
        run: node --test test/*.test.mjs
      - name: Test launcher with isolated fake installers
        run: |
          python3 -m pip install pytest
          python3 -m pytest test/ -q
      - name: Check shell syntax
        run: |
          sh -n v1.sh
          sh -n v2.sh
          cmp v1.sh v2.sh
      - name: Package public files only
        if: github.event_name != 'pull_request'
        run: |
          mkdir _site
          cp v1.sh v2.sh index.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
